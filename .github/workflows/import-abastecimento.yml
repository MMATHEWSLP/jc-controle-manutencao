name: Importar histórico de abastecimento (Arapiuns)

# Carga retroativa da planilha scripts/import-abastecimento/data/Historico_de_Abastecimento_LIMPO_2026-09-29.xlsx
# (aba Dados_Limpos) para o módulo Combustível. Rode primeiro em dry-run e confira o resumo no log.
# Pré-requisito: migração 0023 aplicada (workflow "Migrar banco de dados (Drizzle)").

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "dry-run (simulação), confirmar (grava), reverter-simulacao (mostra o lote) ou reverter (apaga o lote)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - confirmar
          - reverter-simulacao
          - reverter
          - ajustar-saldo-simulacao
          - ajustar-saldo
          - vincular-terceiros-simulacao
          - vincular-terceiros
      vinculos:
        description: "Só em vincular-terceiros: PLACA=RESPONSÁVEL separados por ; (ex.: QEH4C88=REGINALDO; NTA0B14=ANDRE)"
        required: false
        default: ""
        type: string
      empresa:
        description: "Só em vincular-terceiros: prestador onde cadastrar os caminhões que ainda não estão no cadastro"
        required: false
        default: ""
        type: string
      arquivo:
        description: "Planilha a importar (vazio = scripts/import-abastecimento/data/Historico_de_Abastecimento_LIMPO_2026-09-29.xlsx)"
        required: false
        default: ""
        type: string
      lote:
        description: "Identificador do lote (vazio = historico_planilha_2026-09-29; no ajuste de saldo = ajuste_saldo_<data>)"
        required: false
        default: ""
        type: string
      saldos_alvo:
        description: "Só no ajuste de saldo. Ex.: Diesel S10:FRENTE=83174; Diesel S10:PORTO=16379,99; Gasolina Comum:FRENTE=2508,97"
        required: false
        default: ""
        type: string
      destino_transferencia:
        description: "Destino das linhas de Transferência: PORTO (Frente → Porto da própria Arapiuns) ou o nome de outra frente"
        required: true
        default: "PORTO"
        type: string
      combustivel_ausente:
        description: "Combustível para as linhas sem 'Tipo Combustível' (vazio = essas linhas dão erro)"
        required: false
        default: "Diesel S10"
        type: string
      ignorar_erros:
        description: "Gravar as linhas válidas mesmo se houver linhas com erro"
        type: boolean
        default: false

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Rodar importação
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODO: ${{ github.event.inputs.modo }}
          DESTINO: ${{ github.event.inputs.destino_transferencia }}
          IGNORAR: ${{ github.event.inputs.ignorar_erros }}
          AUSENTE: ${{ github.event.inputs.combustivel_ausente }}
          ARQUIVO: ${{ github.event.inputs.arquivo }}
          LOTE: ${{ github.event.inputs.lote }}
          ALVO: ${{ github.event.inputs.saldos_alvo }}
          VINCULOS: ${{ github.event.inputs.vinculos }}
          EMPRESA: ${{ github.event.inputs.empresa }}
        run: |
          if [ "$MODO" = "vincular-terceiros-simulacao" ] || [ "$MODO" = "vincular-terceiros" ]; then
            ARGS=("--vinculos=$VINCULOS")
            if [ -n "$EMPRESA" ]; then ARGS+=("--empresa=$EMPRESA"); fi
            if [ "$MODO" = "vincular-terceiros" ]; then ARGS+=("--confirmar"); fi
            node vincular-saidas-terceiros.mjs "${ARGS[@]}"
            exit $?
          fi
          if [ "$MODO" = "ajustar-saldo-simulacao" ] || [ "$MODO" = "ajustar-saldo" ]; then
            ARGS=("--alvo=$ALVO")
            if [ -n "$LOTE" ]; then ARGS+=("--lote=$LOTE"); fi
            if [ "$MODO" = "ajustar-saldo" ]; then ARGS+=("--confirmar"); fi
            node ajustar-saldo-combustivel.mjs "${ARGS[@]}"
            exit $?
          fi
          ARGS=("--destino-transferencia=$DESTINO")
          if [ -n "$ARQUIVO" ]; then ARGS+=("--arquivo=$ARQUIVO"); fi
          if [ -n "$LOTE" ]; then ARGS+=("--lote=$LOTE"); fi
          if [ "$IGNORAR" = "true" ]; then ARGS+=("--ignorar-erros"); fi
          if [ -n "$AUSENTE" ]; then ARGS+=("--combustivel-ausente=$AUSENTE"); fi
          case "$MODO" in
            confirmar) ARGS+=("--confirmar") ;;
            reverter-simulacao) ARGS+=("--reverter") ;;
            reverter) ARGS+=("--reverter" "--confirmar") ;;
          esac
          node importar-abastecimento.mjs "${ARGS[@]}"
