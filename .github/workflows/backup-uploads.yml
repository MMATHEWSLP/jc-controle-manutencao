name: Backup das fotos e anexos (uploads)

# Fotos de equipamentos/produtos/Controle Diário e orçamentos de pedido ficam só no disco da
# Hostinger (pasta uploads/ do app). Este workflow copia a pasta toda semana e guarda como
# artefato do GitHub por 90 dias (baixe em Actions > execução > Artifacts).
# Usa os mesmos secrets do deploy (HOSTINGER_SSH_*).

on:
  schedule:
    - cron: "17 6 * * 1" # segunda-feira, 03:17 em Fortaleza
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Configura chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Confia no servidor (known_hosts)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copia a pasta uploads
        run: |
          mkdir -p uploads
          rsync -az -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:domains/jcsistema.online/hbuilds/current/nodejs/uploads/ uploads/ || true
          echo "Arquivos copiados: $(find uploads -type f | wc -l)"
          du -sh uploads

      - uses: actions/upload-artifact@v4
        with:
          name: uploads-${{ github.run_number }}
          path: uploads
          retention-days: 90
          if-no-files-found: warn
