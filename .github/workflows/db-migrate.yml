name: Migrar banco de dados (Drizzle)

on:
  workflow_dispatch:
    inputs:
      confirmar_data_generica:
        description: "Aplicar de verdade a correção de data genérica dos históricos importados (sem marcar, roda em dry-run e não grava nada)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Aplicar migrações pendentes (drizzle-kit migrate)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Verificar registros que precisam de regularização (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node verificar-regularizacao-tarefas.mjs

      - name: Diagnóstico do histórico de troca de óleo (somente leitura)
        if: hashFiles('diagnosticar-historico-oleo.mjs') != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node diagnosticar-historico-oleo.mjs

      - name: Corrigir históricos importados sem data (data genérica 05/07/2026)
        if: hashFiles('corrigir-historico-data-generica.mjs') != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node corrigir-historico-data-generica.mjs ${{ github.event.inputs.confirmar_data_generica == 'true' && '--confirmar' || '' }}
