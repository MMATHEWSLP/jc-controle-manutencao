name: Migrar banco de dados (Drizzle)

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Aplicar migrações pendentes (drizzle-kit migrate)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Verificar registros que precisam de regularização (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node verificar-regularizacao-tarefas.mjs
