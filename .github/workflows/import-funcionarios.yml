name: Importar funcionários

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "dry-run (simulação, não grava nada) ou confirmar (grava de verdade)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - confirmar
      tipo:
        description: "relacao (cadastra funcionários da relação de uma frente), historico (ciclos de folga + afastamentos do sistema anterior) ou situacao (quem está em viagem para casa / de folga)"
        required: true
        default: "relacao"
        type: choice
        options:
          - relacao
          - historico
          - situacao
      arquivo:
        description: "Na relacao: arquivo da relação · na situacao: arquivo da situação (ambos em scripts/import-funcionarios/data/)"
        required: true
        default: "mamuru-2026-09-28.tsv"
      folgas:
        description: "Só no historico: arquivo do histórico de folgas em scripts/import-funcionarios/data/"
        required: false
        default: "folgas-2026-09-28.tsv"
      afastamentos:
        description: "Só no historico: arquivo de afastamentos em scripts/import-funcionarios/data/"
        required: false
        default: "afastamentos-2026-09-28.tsv"
      frente:
        description: "Frente de serviço dos funcionários da relação"
        required: true
        default: "Mamuru"
      data:
        description: "Data da relação (AAAA-MM-DD) — início das folgas/afastamentos em aberto"
        required: true
        default: "2026-09-28"

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Rodar importação
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODO: ${{ github.event.inputs.modo }}
          TIPO: ${{ github.event.inputs.tipo }}
          FOLGAS: ${{ github.event.inputs.folgas }}
          AFASTAMENTOS: ${{ github.event.inputs.afastamentos }}
          ARQUIVO: ${{ github.event.inputs.arquivo }}
          FRENTE: ${{ github.event.inputs.frente }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          for NOME in "$ARQUIVO" "$FOLGAS" "$AFASTAMENTOS"; do case "$NOME" in */*|*..*) echo "Informe só o nome do arquivo."; exit 1;; esac; done
          FLAG=""
          if [ "$MODO" = "confirmar" ]; then FLAG="--confirmar"; fi
          DIR=scripts/import-funcionarios/data
          if [ "$TIPO" = "historico" ]; then
            node importar-historico-funcionarios.mjs $FLAG "--folgas=$DIR/$FOLGAS" "--afastamentos=$DIR/$AFASTAMENTOS" "--data=$DATA"
          elif [ "$TIPO" = "situacao" ]; then
            node importar-situacao-folgas.mjs $FLAG "--arquivo=$DIR/$ARQUIVO" "--data=$DATA"
          else
            node importar-funcionarios.mjs $FLAG "--arquivo=$DIR/$ARQUIVO" "--frente=$FRENTE" "--data=$DATA"
          fi

      # Acesso de operador acompanha o cadastro: desativa demitidos/funções que não operam e marca os
      # pendentes (a criação, com o PDF dos PINs, é em Usuários > Operadores).
      - name: Sincronizar acessos de operador
        if: github.event.inputs.modo == 'confirmar'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sincronizar-operadores.ts --confirmar
