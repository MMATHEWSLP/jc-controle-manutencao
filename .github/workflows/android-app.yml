name: App Android (JC Sistema)

# Compila o app Android (pasta android-app/) na nuvem.
#  - Conferência: a cada push que mexe em android-app/ → testes + lint + APK de teste (artefato).
#  - Versão oficial: "Run workflow" (versão, novidades, obrigatória) ou uma tag v1.0.1 →
#    APK assinado com a chave dos secrets, Release no GitHub e publicação no site
#    (https://www.jcsistema.online/app/baixar, /app/versao.json e /app/jc-sistema.apk).
# Passo a passo: android-app/LEIA-ME.md

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão do app (ex.: 1.0.1). Precisa ser maior que a publicada."
        required: true
        type: string
      notas:
        description: "Novidades (aparecem no aviso de atualização e na página de download)"
        required: false
        type: string
        default: ""
      obrigatoria:
        description: "Atualização obrigatória (com internet, o app só abre depois de atualizar)"
        type: boolean
        default: false
      publicar:
        description: "Publicar no site para todos os celulares (desmarque para só gerar o APK)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - name: Tipo de build e versão
        id: v
        env:
          INPUT_VERSAO: ${{ inputs.versao }}
          INPUT_NOTAS: ${{ inputs.notas }}
          INPUT_OBRIGATORIA: ${{ inputs.obrigatoria }}
          INPUT_PUBLICAR: ${{ inputs.publicar }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE=release; VERSION="${INPUT_VERSAO#v}"; NOTES="$INPUT_NOTAS"; MANDATORY="$INPUT_OBRIGATORIA"; PUBLISH="$INPUT_PUBLICAR"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MODE=release; VERSION="${GITHUB_REF_NAME#v}"; MANDATORY=false; PUBLISH=true
            # Novidades = mensagem da tag anotada (git tag -a v1.0.1 -m "...").
            git fetch --quiet --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
            NOTES="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' | sed '/-----BEGIN PGP/,$d')"
          else
            MODE=check; VERSION="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"; NOTES=""; MANDATORY=false; PUBLISH=false
          fi
          VERSION="$(echo "$VERSION" | tr -d '[:space:]')"
          if ! [[ "$VERSION" =~ ^([0-9]{1,3})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Versão inválida: '$VERSION'. Use o formato 1.0.1."; exit 1
          fi
          CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ] || NOTES="Melhorias e correções."
          {
            echo "mode=$MODE"; echo "version=$VERSION"; echo "code=$CODE"; echo "mandatory=$MANDATORY"; echo "publish=$PUBLISH"
            echo "notes<<NOTAS_FIM"; echo "$NOTES"; echo "NOTAS_FIM"
          } >> "$GITHUB_OUTPUT"
          echo "Build: $MODE · versão $VERSION (código $CODE) · publicar no site: $PUBLISH · obrigatória: $MANDATORY"

      - name: Confere se a versão é maior que a publicada
        if: steps.v.outputs.mode == 'release' && steps.v.outputs.publish == 'true'
        env:
          CODE: ${{ steps.v.outputs.code }}
        run: |
          set -euo pipefail
          PUBLISHED="$(curl -fsS --max-time 20 https://www.jcsistema.online/app/versao.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("versionCode",0))' 2>/dev/null || echo 0)"
          echo "Publicada no site: $PUBLISHED · nova: $CODE"
          if [ "$PUBLISHED" -ge "$CODE" ]; then
            echo "::error::A versão do site ($PUBLISHED) já é igual ou maior que a nova ($CODE). Use um número de versão maior."; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (dos secrets)
        if: steps.v.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Faltam os secrets da chave (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Veja android-app/LEIA-ME.md, passos 1 e 2."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/jc-sistema.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jc-sistema.jks" >> "$GITHUB_ENV"

      - name: Firebase (avisos no celular)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          MODE: ${{ steps.v.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            if [ "$MODE" = "release" ]; then echo "::warning::Secret FIREBASE_GOOGLE_SERVICES_JSON não cadastrado: o app sai sem aviso no celular (o sino do sistema continua). Veja android-app/LEIA-ME.md, passo 6."; fi
            exit 0
          fi
          # Do google-services.json, os dados do app br.com.jcsistema.campo (o gradle lê ORG_GRADLE_PROJECT_*).
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          client = next((c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "br.com.jcsistema.campo"), None)
          if client is None:
              print("::error::O google-services.json não tem o app Android br.com.jcsistema.campo. Confira o nome do pacote no Firebase (LEIA-ME, passo 6)."); sys.exit(1)
          values = {"fcmAppId": client["client_info"]["mobilesdk_app_id"], "fcmApiKey": client["api_key"][0]["current_key"],
                    "fcmProjectId": data["project_info"]["project_id"], "fcmSenderId": data["project_info"]["project_number"]}
          with open(__import__("os").environ["GITHUB_ENV"], "a") as env:
              for key, value in values.items():
                  print(f"::add-mask::{value}")
                  env.write(f"ORG_GRADLE_PROJECT_{key}={value}\n")
          print("Firebase ligado no app (projeto " + values["fcmProjectId"] + ").")
          '

      - name: Compila e testa
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MODE: ${{ steps.v.outputs.mode }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "$MODE" = "check" ]; then
            # Também o release (sem assinatura, já que a conferência não usa a chave): confere o R8.
            ./gradlew --no-daemon --stacktrace -PversionName="$VERSION" testDebugUnitTest lintDebug assembleDebug assembleRelease
          else
            ./gradlew --no-daemon --stacktrace -PversionName="$VERSION" testReleaseUnitTest assembleRelease
          fi

      - name: Prepara os arquivos
        id: files
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
          MODE: ${{ steps.v.outputs.mode }}
          MANDATORY: ${{ steps.v.outputs.mandatory }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/saida"; mkdir -p "$OUT"
          if [ "$MODE" = "check" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT/jc-sistema-teste-$VERSION.apk"
            echo "name=jc-sistema-teste-$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp "$APK" "$OUT/jc-sistema-$VERSION.apk"
          cp "$APK" "$OUT/jc-sistema.apk"
          SHA="$(sha256sum "$OUT/jc-sistema.apk" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$OUT/jc-sistema.apk")"
          export SHA SIZE
          python3 - "$OUT/versao.json" <<'PY'
          import json, os, sys, datetime
          data = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": os.environ["VERSION"],
              "url": f"https://www.jcsistema.online/app/jc-sistema.apk?v={os.environ['CODE']}",
              "notas": os.environ.get("NOTES", "").strip(),
              "obrigatoria": os.environ.get("MANDATORY") == "true",
              "sha256": os.environ["SHA"],
              "tamanho": int(os.environ["SIZE"]),
              "publicadoEm": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(data, open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          echo "name=jc-sistema-$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Guarda o APK neste build (aba Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.name }}
          path: saida/
          retention-days: 30
          if-no-files-found: error

      - name: Release no GitHub
        if: steps.v.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JC Sistema ${{ steps.v.outputs.version }}
          body: ${{ steps.v.outputs.notes }}
          files: |
            saida/jc-sistema-${{ steps.v.outputs.version }}.apk
            saida/versao.json
          make_latest: true

      - name: Chave SSH do servidor
        if: steps.v.outputs.mode == 'release' && steps.v.outputs.publish == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Publica no site (APK primeiro, versao.json por último)
        if: steps.v.outputs.mode == 'release' && steps.v.outputs.publish == 'true'
        working-directory: saida
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          set -euo pipefail
          DEST=domains/jcsistema.online/hbuilds/current/nodejs/android-releases
          mkdir -p ~/.ssh && ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $DEST"
          rsync -az -e "ssh -p $SSH_PORT" jc-sistema.apk "$SSH_USER@$SSH_HOST:$DEST/jc-sistema.apk.novo"
          rsync -az -e "ssh -p $SSH_PORT" versao.json "$SSH_USER@$SSH_HOST:$DEST/versao.json.novo"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEST && mv -f jc-sistema.apk.novo jc-sistema.apk && mv -f versao.json.novo versao.json"
          sleep 3
          ONLINE="$(curl -fsS --max-time 20 https://www.jcsistema.online/app/versao.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' || echo "?")"
          if [ "$ONLINE" = "$CODE" ]; then
            echo "Publicado: https://www.jcsistema.online/app/baixar (versão $CODE)"
          else
            echo "::warning::Arquivos enviados, mas https://www.jcsistema.online/app/versao.json respondeu '$ONLINE'. Se o site ainda não tem as rotas /app (deploy do main), elas aparecem depois do próximo deploy."
          fi
